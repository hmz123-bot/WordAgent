server:
  port: 8081

spring:
  application:
    name: word-agent-web
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  # ==================== 数据库配置 ====================
  # 默认使用 H2 文件数据库（无需安装，数据持久化到 ./data/wordagent 目录）
  # 生产环境切换 MySQL：修改 datasource.url / username / password 并激活 mysql profile
  datasource:
    url: jdbc:h2:file:./data/wordagent;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

# ================================================================
# Word Agent 完整配置
# ================================================================
word:
  agent:
    import:
      max-file-size: 52428800    # 50MB
      max-unzipped-size: 524288000 # 500MB
      max-xml-depth: 128
    export:
      default-format: docx

# ================================================================
# AI Gateway 配置（v2 三层架构）
# ================================================================
ai:
  # DeepSeek Provider（便宜模型，续写/校对场景）
  deepseek:
    api-key: "${WORD_AGENT_DEEPSEEK_KEY}"
    endpoint: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"

  # OpenAI Provider（强大模型，润色/翻译场景）
  openai:
    api-key: "${WORD_AGENT_OPENAI_KEY:}"
    endpoint: "https://api.openai.com/v1/chat/completions"
    model: "gpt-4o-mini"

  # Gateway 配置
  gateway:
    # JWT 鉴权开关（开发环境可关）
    jwt-enabled: false
    jwt-secret: "${WORD_AGENT_JWT_SECRET:word-agent-secret-key-min-32-chars!!}"

  # MCP 协议开关
  mcp:
    enabled: false