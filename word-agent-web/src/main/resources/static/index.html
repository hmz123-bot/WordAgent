<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Word Agent - 智能文档编辑平台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c1c7cd;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#a0a7ae}
:root{--primary:#1e3a5f;--primary-light:#2a5298;--accent:#4f7cff;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--surface:#fff;--surface-hover:#f8f9fa;--border:#e5e7eb;--text:#1a1a2e;--text-secondary:#6b7280;--text-muted:#9ca3af;--radius:8px}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--primary)}
.topbar-brand svg{width:26px;height:26px}
.topbar-divider{width:1px;height:24px;background:var(--border)}
.topbar-doc-title{font-size:0.95rem;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 14px;font-size:0.85rem;font-weight:500;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface-hover)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:rgba(0,0,0,0.04)}
.btn-sm{padding:4px 10px;font-size:0.8rem}
.btn svg{width:16px;height:16px;flex-shrink:0}
.main-layout{display:flex;flex:1;overflow:hidden}
.panel-left{width:280px;min-width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-header{padding:14px 16px 10px;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between}
.panel-body{flex:1;overflow-y:auto;padding:0 8px 8px}
.panel-center{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#fafbfc}
.center-toolbar{height:48px;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.toolbar-divider{width:1px;height:20px;background:var(--border)}
.center-content{flex:1;overflow-y:auto;padding:0;position:relative}
.panel-right{width:360px;min-width:360px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.doc-content{padding:32px 48px;max-width:860px;margin:0 auto;min-height:100%}
.doc-content-title{font-size:1.75rem;font-weight:700;margin-bottom:24px;padding-bottom:12px;border-bottom:2px solid var(--border)}
.doc-node{padding:10px 14px;margin:4px 0;border-radius:6px;cursor:pointer}
.doc-node:hover{background:rgba(79,124,255,0.04)}
.doc-node .node-text{font-size:0.95rem;line-height:1.65}
.doc-node.node-heading{font-weight:600}
.doc-node.node-heading.level-1{font-size:1.5rem}
.doc-node.node-heading.level-2{font-size:1.25rem}
.doc-node.node-heading.level-3{font-size:1.1rem}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:12px;width:520px;max-width:90vw;max-height:80vh;overflow:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-body{padding:20px}
.modal-footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--border)}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:var(--radius);background:var(--text);color:#fff;font-size:0.85rem;display:flex;align-items:center;gap:8px;min-width:240px}
.toast.success{background:#065f46}
.toast.error{background:#991b1b}
.status-badge{padding:2px 10px;border-radius:12px;font-size:0.7rem;font-weight:600;letter-spacing:0.02em;white-space:nowrap}
.status-badge.draft{background:rgba(251,191,36,0.18);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
.status-badge.ready{background:rgba(52,211,153,0.18);color:#34d399;border:1px solid rgba(52,211,153,0.3)}
.status-badge.editing{background:rgba(96,165,250,0.18);color:#60a5fa;border:1px solid rgba(96,165,250,0.3)}
.status-badge.error{background:rgba(248,113,113,0.18);color:#f87171;border:1px solid rgba(248,113,113,0.3)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Word Agent
  </div>
  <div class="topbar-divider"></div>
  <span class="topbar-doc-title" id="docTitle">未选择文档</span>
  <span class="status-badge" id="statusBadge" style="display:none"></span>
  <div class="topbar-actions">
    <button class="btn btn-ghost btn-sm" onclick="saveDocument()">&#128190; 保存</button>
    <button class="btn btn-ghost btn-sm" onclick="toggleSearch()">&#128269; 搜索</button>
    <button class="btn btn-ghost btn-sm" onclick="showVersions()">&#128339; 版本</button>
    <button class="btn btn-ghost btn-sm" onclick="exportDocument()">&#128229; 导出</button>
    <button class="btn btn-accent btn-sm" onclick="openNewDoc()">+ 新建</button>
  </div>
</header>
<div class="main-layout">
  <aside class="panel-left">
    <div class="panel-header"><span>文档列表</span><span id="docCount" style="font-weight:400;font-size:0.7rem">0</span></div>
    <div class="upload-zone" id="uploadZone" style="margin:0 8px 8px;padding:20px 16px;border:2px dashed var(--border);border-radius:var(--radius);text-align:center;cursor:pointer" onclick="document.getElementById('fileInput').click()">&#128194; 拖拽或点击上传 .docx 文件</div>
    <input type="file" id="fileInput" accept=".docx" style="display:none" onchange="uploadDocument(event)">
    <div class="panel-body" id="docListPanel"><div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.8rem">暂无文档</div></div>
  </aside>
  <main class="panel-center" style="position:relative">
    <div class="center-toolbar">
      <button class="btn btn-ghost btn-sm" onclick="refreshDocument()">&#128260; 刷新</button>
      <div class="toolbar-divider"></div>
      <button class="btn btn-ghost btn-sm" onclick="showNodeTree()">&#9776; 结构</button>
      <span style="flex:1"></span>
      <span id="nodeCount" style="font-size:0.75rem;color:var(--text-muted)"></span>
    </div>
    <div class="center-content" id="centerContent">
      <div class="empty-state" id="emptyState" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-muted);text-align:center;padding:40px">
        <h3 style="font-size:1.1rem;font-weight:600;color:var(--text-secondary);margin-bottom:6px">选择一个文档开始编辑</h3>
        <p style="font-size:0.85rem;max-width:320px;line-height:1.6">从左侧列表选择文档，或上传新的 .docx 文件。文档内容将在此处呈现。</p>
      </div>
      <div class="doc-content" id="docContent" style="display:none"></div>
    </div>
    <div class="search-overlay" id="searchOverlay" style="display:none;position:absolute;top:0;left:0;right:0;background:var(--surface);padding:12px 16px;z-index:50">
      <div style="display:flex;align-items:center;gap:8px">
        <input type="text" id="searchInput" placeholder="搜索文档内容..." style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem" oninput="searchDocument()" onkeydown="if(event.key==='Enter')searchDocument()">
        <button class="btn btn-sm" onclick="toggleSearch()">&#10005;</button>
      </div>
      <div id="searchResults" style="margin-top:8px;max-height:200px;overflow-y:auto"></div>
    </div>
  </main>
  <aside class="panel-right" id="rightPanel">
    <div style="padding:16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:600;color:var(--text-secondary);margin-bottom:8px">&#9889; AI 智能编辑</div>
      <div style="position:relative">
        <textarea id="aiInput" placeholder="描述你想要的编辑操作..." rows="2" style="width:100%;padding:10px 12px;padding-right:40px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;resize:none;min-height:60px" oninput="toggleAiBtn()"></textarea>
        <button id="aiSendBtn" onclick="sendAiEdit()" disabled style="position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer">&#10148;</button>
      </div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
        <span onclick="setAiPrompt('将所有标题加粗')" style="padding:4px 10px;font-size:0.75rem;border-radius:12px;background:#f0f4ff;color:var(--accent);border:1px solid #dbe6ff;cursor:pointer">&#9889; 加粗标题</span>
        <span onclick="setAiPrompt('将文档翻译成英文')" style="padding:4px 10px;font-size:0.75rem;border-radius:12px;background:#f0f4ff;color:var(--accent);border:1px solid #dbe6ff;cursor:pointer">&#9889; 翻译英文</span>
        <span onclick="setAiPrompt('优化排版')" style="padding:4px 10px;font-size:0.75rem;border-radius:12px;background:#f0f4ff;color:var(--accent);border:1px solid #dbe6ff;cursor:pointer">&#9889; 优化排版</span>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:12px 16px;font-size:0.75rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-light)">
        <span>变更集</span>
        <button class="btn btn-ghost btn-sm" onclick="refreshChangeSets()">&#128260;</button>
      </div>
      <div class="changeset-list" id="changeSetList" style="flex:1;overflow-y:auto;padding:8px">
        <div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.8rem">暂无变更记录</div>
      </div>
    </div>
  </aside>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><h3 id="modalTitle">标题</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">&#10005;</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<script>
const API_BASE = '/api/v1';
let currentDocId = null;

function toast(msg, type) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function api(path, opts) {
  const res = await fetch(API_BASE + path, { headers: {'Content-Type':'application/json'}, ...opts });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || '请求失败');
  return data;
}

async function loadDocuments() {
  try {
    const res = await api('/documents');
    const docs = res.data || [];
    document.getElementById('docCount').textContent = docs.length;
    const panel = document.getElementById('docListPanel');
    if (docs.length === 0) {
      panel.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.8rem">暂无文档</div>';
      return;
    }
    panel.innerHTML = '<div style="display:flex;flex-direction:column;gap:2px">' + docs.map(function(d) {
      var name = d.fileName || d.title || d.documentId || '未命名';
      var date = d.createdAt ? new Date(d.createdAt).toLocaleDateString() : '';
      var draftTag = d.status === 'DRAFT' ? '<span style="font-size:0.65rem;color:#fbbf24;background:rgba(251,191,36,0.15);padding:1px 6px;border-radius:8px">草稿</span>' : '';
      return '<div onclick="selectDocument(\'' + d.documentId + '\')" style="display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer' + (d.documentId===currentDocId?';background:#eef2ff;outline:1px solid #c7d2fe':'') + '">' +
        '<div style="width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#1e3a5f,#2a5298);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;font-size:0.75rem">' + name.charAt(0).toUpperCase() + '</div>' +
        '<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:0.85rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">' + name + '</span>' + draftTag + '</div>' +
        '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px">' + date + '</div></div>' +
        '<div onclick="event.stopPropagation();deleteDocument(\'' + d.documentId + '\')" style="cursor:pointer;color:var(--text-muted);padding:4px" title="删除">&#10005;</div></div>';
    }).join('') + '</div>';
  } catch(e) { toast(e.message, 'error'); }
}

async function selectDocument(docId) {
  currentDocId = docId;
  document.getElementById('docTitle').textContent = '加载中...';
  updateStatusBadge(null);
  loadDocuments();
  try {
    var assetRes = await api('/documents/' + docId);
    var asset = assetRes.data;
    if (asset && asset.status) updateStatusBadge(asset.status);
    var res = await api('/documents/' + docId + '/projection');
    var proj = res.data;
    document.getElementById('docTitle').textContent = proj.title || '未命名文档';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('docContent').style.display = 'block';
    renderProjection(proj);
    loadChangeSets(docId);
  } catch(e) { toast(e.message, 'error'); }
}

function renderProjection(proj) {
  var el = document.getElementById('docContent');
  var html = '<div class="doc-content-title">' + (proj.title || '文档') + '</div>';
  if (proj.content && proj.content.length > 0) {
    proj.content.forEach(function(n) { html += renderNode(n); });
  } else {
    html += '<p style="text-align:center;color:var(--text-muted);padding:20px">文档内容为空</p>';
  }
  el.innerHTML = html;
  document.getElementById('nodeCount').textContent = proj.content ? proj.content.length + ' 个节点' : '';
}

function renderNode(node) {
  var type = node.nodeType || 'paragraph';
  var text = node.text || '';
  var cls = 'doc-node';
  if (type === 'heading') {
    var level = 1;
    if (node.attributes && node.attributes.level) level = node.attributes.level;
    cls += ' node-heading level-' + Math.min(level, 3);
  }
  var h = '<div class="' + cls + '"><span class="node-text">' + escapeHtml(text) + '</span></div>';
  return h;
}

function escapeHtml(s) { if (!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function uploadDocument(e) {
  if (e.target.files.length > 0) uploadFile(e.target.files[0]);
}

async function uploadFile(file) {
  if (!file.name.endsWith('.docx')) { toast('仅支持 .docx 格式', 'error'); return; }
  var fd = new FormData();
  fd.append('file', file);
  try {
    var res = await fetch(API_BASE + '/documents/import', { method: 'POST', body: fd });
    var data = await res.json();
    if (!res.ok) throw new Error(data.message || '上传失败');
    toast('上传成功: ' + file.name, 'success');
    loadDocuments();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteDocument(docId) {
  if (!confirm('确定删除此文档？')) return;
  try {
    await api('/documents/' + docId, { method: 'DELETE' });
    toast('已删除', 'success');
    if (currentDocId === docId) {
      currentDocId = null;
      document.getElementById('docTitle').textContent = '未选择文档';
      document.getElementById('emptyState').style.display = 'flex';
      document.getElementById('docContent').style.display = 'none';
    }
    loadDocuments();
  } catch(e) { toast(e.message, 'error'); }
}

async function loadChangeSets(docId) {
  try {
    var res = await api('/documents/' + docId + '/changesets');
    var csl = document.getElementById('changeSetList');
    var cs = res.data || [];
    if (cs.length === 0) {
      csl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:0.8rem">暂无变更记录</div>';
      return;
    }
    csl.innerHTML = cs.map(function(c) {
      var s = (c.reviewStatus || 'DRAFT').toLowerCase();
      var sm = {draft:'草稿',pending:'待审',approved:'已通过',accepted:'已接受',rejected:'已拒绝'};
      var sc = {draft:'#f3f4f6;color:#6b7280',pending:'#fef3c7;color:#d97706',approved:'#d1fae5;color:#059669',accepted:'#d1fae5;color:#059669',rejected:'#fee2e2;color:#dc2626'};
      return '<div style="padding:12px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border)">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<span style="font-size:0.85rem;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (c.summary || '变更') + '</span>' +
        '<span style="padding:2px 8px;font-size:0.7rem;font-weight:600;border-radius:10px;background:' + (sc[s]||'#f3f4f6;color:#6b7280') + '">' + (sm[s]||c.reviewStatus) + '</span></div>' +
        '<div style="font-size:0.75rem;color:var(--text-muted)">' + (c.authorId ? '作者: ' + c.authorId : '') + '</div>' +
        ((s === 'pending') ? '<div style="display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light)">' +
          '<button class="btn btn-sm btn-success" onclick="acceptChangeSet(\'' + c.changeSetId + '\')">接受</button>' +
          '<button class="btn btn-sm btn-danger" onclick="rejectChangeSet(\'' + c.changeSetId + '\')">拒绝</button></div>' : '') + '</div>';
    }).join('');
  } catch(e) {}
}

async function acceptChangeSet(csId) {
  try {
    await api('/documents/' + currentDocId + '/changesets/' + csId + '/accept', { method: 'POST' });
    toast('已接受变更', 'success');
    selectDocument(currentDocId);
  } catch(e) { toast(e.message, 'error'); }
}

async function rejectChangeSet(csId) {
  var reason = prompt('请输入拒绝原因（可选）:');
  try {
    await api('/documents/' + currentDocId + '/changesets/' + csId + '/reject', { method: 'POST', body: reason ? JSON.stringify({reason:reason}) : '{}' });
    toast('已拒绝变更', 'success');
    loadChangeSets(currentDocId);
  } catch(e) { toast(e.message, 'error'); }
}

function toggleAiBtn() {
  var inp = document.getElementById('aiInput');
  document.getElementById('aiSendBtn').disabled = !inp.value.trim();
}

function setAiPrompt(t) {
  document.getElementById('aiInput').value = t;
  document.getElementById('aiSendBtn').disabled = false;
}

async function sendAiEdit() {
  var prompt = document.getElementById('aiInput').value.trim();
  if (!prompt || !currentDocId) return;
  document.getElementById('aiSendBtn').disabled = true;
  document.getElementById('aiSendBtn').innerHTML = '...';
  try {
    var res = await api('/documents/' + currentDocId + '/changesets', {
      method: 'POST',
      body: JSON.stringify({
        documentId: currentDocId,
        expectedVersion: 1,
        summary: prompt,
        authorId: 'web-user',
        authorType: 'user',
        changes: [{
          operation: 'UPDATE',
          targetNodeId: currentDocId,
          targetNodeType: 'document',
          newValue: prompt
        }]
      })
    });
    toast('AI 编辑请求已创建', 'success');
    document.getElementById('aiInput').value = '';
    loadChangeSets(currentDocId);
  } catch(e) { toast(e.message, 'error'); }
  document.getElementById('aiSendBtn').disabled = false;
  document.getElementById('aiSendBtn').innerHTML = '&#10148;';
}

function refreshDocument() { if (currentDocId) selectDocument(currentDocId); }
function refreshChangeSets() { if (currentDocId) loadChangeSets(currentDocId); }
function toggleSearch() { var o = document.getElementById('searchOverlay'); o.style.display = o.style.display === 'block' ? 'none' : 'block'; if (o.style.display === 'block') document.getElementById('searchInput').focus(); }
async function searchDocument() {
  var q = document.getElementById('searchInput').value.trim();
  var r = document.getElementById('searchResults');
  if (!q || !currentDocId) { r.innerHTML = ''; return; }
  try {
    var res = await api('/documents/' + currentDocId + '/search', { method: 'POST', body: JSON.stringify({ query: q, mode: 'text' }) });
    var results = res.data;
    if (results && results.matches) {
      r.innerHTML = results.matches.map(function(m) { return '<div style="padding:6px 8px;border-radius:4px;font-size:0.8rem;cursor:pointer">' + escapeHtml(m.text || m.nodeId) + '</div>'; }).join('') || '<div style="font-size:0.8rem;padding:8px;color:var(--text-muted)">无结果</div>';
    }
  } catch(e) { r.innerHTML = '<div style="font-size:0.8rem;color:var(--text-muted)">搜索失败</div>'; }
}
function showVersions() { toast('版本历史功能开发中', 'info'); }
function saveDocument() {
  if (!currentDocId) { toast('请先选择文档', 'info'); return; }
  api('/documents/' + currentDocId + '/save-draft', { method: 'POST' })
    .then(function(res) {
      toast('草稿已保存', 'success');
      updateStatusBadge('DRAFT');
    })
    .catch(function(e) { toast(e.message, 'error'); });
}

function updateStatusBadge(status) {
  var badge = document.getElementById('statusBadge');
  if (!status) { badge.style.display = 'none'; return; }
  var textMap = { DRAFT: '草稿', READY: '就绪', EDITING: '编辑中', ERROR: '异常' };
  badge.textContent = textMap[status] || status;
  badge.className = 'status-badge ' + (status || '').toLowerCase();
  badge.style.display = 'inline-block';
}
function exportDocument() { if (currentDocId) window.open(API_BASE + '/documents/' + currentDocId + '/export', '_blank'); else toast('请先选择文档', 'info'); }
function openNewDoc() { document.getElementById('fileInput').click(); }
function showNodeTree() { toast('文档结构功能开发中', 'info'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveDocument(); }
});
loadDocuments();
</script>
</body>
</html>
